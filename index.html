<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projeto Shiny</title>
<link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/5/51/Pokebola-pokeball-png-0.png" type="image/png">
<style>
*{box-sizing:border-box}
html,body{overscroll-behavior-y:none}
body{margin:0;min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;color:#fff;background:linear-gradient(160deg,#1a0f45 0%,#3b1a78 55%,#7a2a8f 80%,#d9476b 100%) fixed;padding:16px 14px 30px}
.wrap{max-width:1000px;margin:0 auto}
.ball{display:inline-block;flex:0 0 auto;width:34px;height:34px;background:var(--ball) center/contain no-repeat}
header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:12px}
.logo .ball{width:54px;height:54px}
h1{margin:0;font-size:2.2rem;line-height:1;color:#ffd23f;text-shadow:0 3px 0 #b3361f,0 0 18px #ffb70055}
h1 small{color:#fff;font-size:1.5rem}
.logo p{margin:4px 0 0;font-size:.9rem;font-style:italic;opacity:.9}
.qb{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:18px;background:rgba(15,8,50,.7);border:2px solid #6c4bd1;font-weight:600}
select{font:inherit;font-weight:700;color:#2a1a5e;background:#e7e1ff;border:0;border-radius:12px;padding:7px 10px;cursor:pointer}
#filtros{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:22px 0 16px}
.pill{font:inherit;font-weight:600;color:#fff;cursor:pointer;padding:10px 18px;border-radius:999px;border:2px solid #6c4bd1;background:rgba(15,8,50,.65);transition:.15s}
.pill:hover{transform:translateY(-2px)}
.pill.on{background:linear-gradient(#ff5560,#c91d2e);border-color:#ff9aa2;box-shadow:0 0 14px #ff3b4a88}
.pill:disabled,#sortear:disabled{opacity:.6;cursor:not-allowed}
#roleta{position:relative;height:215px;overflow:hidden;border-radius:22px;background:rgba(140,130,230,.28);border:2px solid rgba(255,255,255,.28)}
#track{position:absolute;left:0;top:0;height:100%;display:flex;will-change:transform}
.cell{flex:0 0 var(--cw);width:var(--cw);height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
.cell img{max-width:100%;max-height:118px;object-fit:contain;filter:drop-shadow(0 4px 6px #0006)}
.cell span{font-weight:800;font-size:.85rem;text-align:center;line-height:1.1;text-shadow:0 2px 3px #000a}
#frame{position:absolute;top:8px;bottom:8px;left:50%;width:calc(var(--cw) - 8px);transform:translateX(-50%);border:3px solid #ffd23f;border-radius:18px;box-shadow:0 0 20px #ffd23f99,inset 0 0 20px #ffd23f33;pointer-events:none}
#sortear{display:flex;align-items:center;gap:12px;margin:22px auto 0;font:inherit;font-size:1.7rem;font-weight:800;color:#fff;cursor:pointer;padding:12px 46px 12px 22px;border-radius:999px;border:4px solid #ffd23f;background:linear-gradient(#ff4b57,#b3121f);text-shadow:0 2px 3px #0008;box-shadow:0 6px 0 #7d0c16,0 0 24px #ff3b4a77}
#sortear:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #7d0c16}
#res{text-align:center;min-height:90px;margin-top:20px}
#r1{font-size:clamp(1.4rem,4.5vw,2.2rem);font-weight:800;text-shadow:0 3px 8px #0008}
#r2{font-size:clamp(1.1rem,3.5vw,1.5rem);margin-top:6px;color:#ffe9a6}
#apoio{margin:26px auto 0;max-width:760px;padding:18px;border-radius:22px;background:rgba(15,8,50,.6);border:2px solid #6c4bd1;text-align:center}
#apoio h2{margin:0 0 6px;font-size:1.25rem}
#apoio h2 b{color:#ffd23f}
#btnApoio{font:inherit;font-size:1.2rem;font-weight:800;color:#3a2200;cursor:pointer;padding:10px 28px;border-radius:999px;border:3px solid #fff3b0;background:linear-gradient(#ffd23f,#f5a300);box-shadow:0 0 16px #ffb70066}
#painel{display:none;margin:18px auto 0;padding:16px;max-width:520px;border-radius:18px;border:3px solid #f5a300;background:rgba(30,15,70,.85);gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
#painel.open{display:flex}
#qr{background:#fff;padding:10px;border-radius:12px;width:182px;height:182px;display:flex;align-items:center;justify-content:center;color:#222;font-size:.8rem}
.chave{flex:1;min-width:210px;text-align:left}
.chave div{font-weight:700;margin-bottom:6px}
#kbox{word-break:break-all;background:#e7e1ff;color:#2a1a5e;font-weight:700;border-radius:10px;padding:9px 10px;font-size:.85rem}
#copiar{width:100%;margin-top:10px;font:inherit;font-weight:700;color:#fff;cursor:pointer;padding:10px;border-radius:12px;border:2px solid #6c4bd1;background:rgba(15,8,50,.8)}
footer{margin-top:24px;text-align:center;font-size:.75rem;opacity:.7}
@media(max-width:600px){h1{font-size:1.8rem}#roleta{height:190px}.cell img{max-height:100px}#sortear{font-size:1.4rem}.qb{width:100%;justify-content:space-between}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><i class="ball"></i><div><h1>Shiny <small>do</small> Dia</h1><p>Rolete um Projeto de Shiny ou Mega!</p></div></div>
    <label class="qb"><i class="ball"></i><span id="qlbl">Quantas Poké Balls?</span><select id="qsel"></select></label>
  </header>
  <nav id="filtros"></nav>
  <div id="roleta"><div id="track"></div><div id="frame"></div></div>
  <button id="sortear"><i class="ball"></i>Sortear</button>
  <div id="res"><div id="r1"></div><div id="r2"></div></div>
  <section id="apoio">
    <h2>💖 Gostou do site e quer me <b>apoiar</b>? Me paga um cafezinho ;D</h2>
    <button id="btnApoio">☕ Apoie-me</button>
    <div id="painel">
      <div id="qr">Carregando QR...</div>
      <div class="chave"><div>Chave Pix:</div><div id="kbox"></div><button id="copiar">Copiar chave Pix</button></div>
    </div>
  </section>
  <footer>Site de fãs, sem fins comerciais e sem ligação com Nintendo, Game Freak ou Creatures. Imagens pertencem aos seus respectivos donos.</footer>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ===== CONFIGURAÇÃO ===== */
const BASE = "https://wiki.pokexgames.com/images/";
const IMG_POKEBOLA = "https://upload.wikimedia.org/wikipedia/commons/5/51/Pokebola-pokeball-png-0.png"; // imagem da Pokébola (PNG transparente)
document.documentElement.style.setProperty("--ball", `url("${IMG_POKEBOLA}")`);
const CHAVE_PIX = "7c57b59a-a280-44e1-8379-fd548899a526";
const NOME_PIX = "CHARLLES ALBERT DE ARAUJO";  // até 25 letras, MAIÚSCULAS, sem acento
const CIDADE_PIX = "RIO TINTO";                // até 15 letras, MAIÚSCULAS, sem acento
const DURACAO = 5500, VOLTAS = 4;
const EMOJIS = ["💥", "🎉", "🎊", "✨"];

/* [nome, caminho do gif, categorias] — A=T1A, B=T1B, C=T1C, M=Mega.
   Quem tem "M" junto (ex.: "AM") aparece nas duas listas e conta como Mega (drop). */
const D = [
["Shiny Alakazam","8/8f/ShiAlakazam.gif","A"],
["Shiny Electabuzz","f/f0/ShiElectabuzz.gif","A"],
["Shiny Magmar","6/6c/ShiMagmar.gif","A"],
["Red Gyarados","2/20/RedGyarados.gif","A"],
["Mega Scizor","2/2e/MegaScizor.gif","AM"],
["Shiny Arcanine & Shiny Growlithe","c/c5/ShinyArcanine.gif","B"],
["Shiny Gengar","b/b2/ShiGengar2.gif","B"],
["Shiny Tauros","9/90/ShinyTauros.gif","B"],
["Shiny Dragonair & Shiny Dratini","5/5e/Shidragonair.gif","B"],
["Shiny Pupitar & Shiny Larvitar","d/d8/ShinyPupitar.gif","B"],
["Mega Aggron","6/60/MegaAggron.gif","BM"],
["Shiny Venusaur","a/aa/Shivenusaur.gif","C"],
["Shiny Charizard","f/fe/ShinyCharizard.gif","C"],
["Shiny Blastoise","f/fa/Shiblastoise.gif","C"],
["Shiny Pidgeot","0/0d/ShiPidgeot.gif","C"],
["Shiny Raichu","6/6a/ShiRaichu.gif","C"],
["Shiny Venomoth","1/10/ShinyVenomoth.gif","C"],
["Shiny Machamp","8/82/ShinyMachamppxg.gif","C"],
["Shiny Tentacruel","a/a6/ShinyTentacruel.gif","C"],
["Elite Farfetch'D","6/63/ShiFarfetchd.gif","C"],
["Shiny Muk","a/ae/ShiMuk.gif","C"],
["Shiny Mr.Mime","9/9f/ShiMrMime.gif","C"],
["Shiny Jynx","9/95/ShiJynx.gif","C"],
["Shiny Pinsir","c/cf/ShiPinsir.gif","C"],
["Aerodactyl","0/05/142_-_Aerodactyl.gif","C"],
["Shiny Meganium","c/c4/Shimeganium.gif","C"],
["Shiny Typhlosion","b/b1/ShinyTyphlosion.gif","C"],
["Shiny Feraligatr","f/f0/ShinyFeraligatr.gif","C"],
["Shiny Lanturn","2/2b/ShinyLanturn.gif","C"],
["Shiny Xatu","5/59/ShiXatu.gif","C"],
["Shiny Ampharos","b/bb/Shiampharos.gif","C"],
["Shiny Magcargo","7/74/ShinyMagcargopxg.gif","C"],
["Mega Houndoom","7/74/Houndoom_Mega_XY.gif","M"],
["Mega Sceptile","f/fb/MegaSceptile.gif","M"],
["Mega Blaziken","1/1a/MegaBlaziken.gif","M"],
["Mega Swampert","a/a3/MegaSwampert.gif","M"],
["Mega Sableye","8/81/MegaSableye.gif","M"],
["Mega Manectric","9/9b/MegaManectric.gif","M"],
["Mega Lucario","f/fc/MegaLucario.gif","M"]
];
const FILTROS = [
  ["Todos","ABCM"],["Apenas T1A","A"],["Apenas T1B","B"],["Apenas T1C","C"],
  ["Apenas T1A e T1B","AB"],["Apenas T1A, T1B e T1C","ABC"],["Apenas T1B e T1C","BC"],
  ["Apenas Megas","M"],["Apenas Megas e T1C","MC"]
];
const QTDS = [["De 1 a 3","1-3"],["De 1 a 5","1-5"],["De 1 a 10","1-10"],["Eu que escolho",""]];

/* ===== ESTADO ===== */
const $ = id => document.getElementById(id);
const roleta = $("roleta"), track = $("track");
let filtroAtual = "ABCM", lista = [], offset = 0, W = 0, CW = 170, cells = [], girando = false;
let resultadoSelecionado = null;
const CHAVE_ESTADO_SORTEIO = "projetoShinyUltimoSorteio";

function salvarResultado() {
  try {
    sessionStorage.setItem(CHAVE_ESTADO_SORTEIO, JSON.stringify({
      filtro: filtroAtual,
      pokemon: resultadoSelecionado ? resultadoSelecionado[0] : null,
      quantidade: $("qsel").value,
      r1: $("r1").textContent,
      r2: $("r2").textContent
    }));
  } catch (e) {}
}

function restaurarResultado() {
  try {
    const salvo = JSON.parse(sessionStorage.getItem(CHAVE_ESTADO_SORTEIO) || "null");
    if (!salvo || !salvo.pokemon) return;

    const filtroExiste = FILTROS.some(([, cats]) => cats === salvo.filtro);
    if (filtroExiste) {
      filtroAtual = salvo.filtro;
      document.querySelectorAll(".pill").forEach((b, i) => {
        b.classList.toggle("on", FILTROS[i][1] === filtroAtual);
      });
      aplicarFiltro();
    }

    const indice = lista.findIndex(d => d[0] === salvo.pokemon);
    if (indice === -1) return;

    resultadoSelecionado = lista[indice];
    $("qsel").value = salvo.quantidade;
    $("r1").textContent = salvo.r1 || "";
    $("r2").textContent = salvo.r2 || "";
    offset = indice * CW + CW / 2 - W / 2;
    draw();
  } catch (e) {}
}

function aplicarFiltro() {
  resultadoSelecionado = null;
  lista = D.filter(d => [...filtroAtual].some(c => d[2].includes(c)));
  cells.forEach(c => c.k = null);
  $("qlbl").textContent = filtroAtual === "M" ? "Quantos Megas?" : "Quantas Poké Balls?";
  offset = CW / 2 - W / 2;
  draw();
}
function layout() {
  W = roleta.clientWidth;
  CW = Math.max(105, Math.min(180, W / (W < 640 ? 3 : 5)));
  roleta.style.setProperty("--cw", CW + "px");
  const n = Math.ceil(W / CW) + 3;
  while (cells.length < n) {
    const el = document.createElement("div"); el.className = "cell";
    const img = document.createElement("img"); img.alt = ""; img.draggable = false;
    img.onerror = () => { img.style.visibility = "hidden"; };
    const sp = document.createElement("span");
    el.append(img, sp); track.appendChild(el);
    cells.push({ el, img, sp, k: null });
  }
  while (cells.length > n) track.removeChild(cells.pop().el);
  cells.forEach(c => c.k = null);
  draw();
}
function draw() {
  if (!lista.length) return;
  const n = lista.length, first = Math.floor(offset / CW);
  track.style.transform = `translateX(${-(offset - first * CW)}px)`;
  cells.forEach((c, i) => {
    const k = first + i;
    if (c.k === k) return;
    c.k = k;
    const d = lista[((k % n) + n) % n];
    c.img.style.visibility = ""; c.img.src = BASE + d[1]; c.sp.textContent = d[0];
  });
}

/* ===== SORTEIO ===== */
let alvo, ini, fim, t0;
function sortear() {
  if (girando || !lista.length) return;
  girando = true;
  $("sortear").disabled = true;
  document.querySelectorAll(".pill").forEach(b => b.disabled = true);
  $("r1").textContent = "Girando..."; $("r2").textContent = "";
  const n = lista.length;
  alvo = Math.floor(Math.random() * n);
  const atual = Math.floor((offset + W / 2) / CW);
  const base = atual + VOLTAS * n;
  const kFinal = base + (((alvo - base) % n) + n) % n;
  ini = offset; fim = kFinal * CW + CW / 2 - W / 2; t0 = performance.now();
  requestAnimationFrame(animar);
}
function animar(t) {
  const p = Math.min((t - t0) / DURACAO, 1);
  offset = ini + (fim - ini) * (1 - Math.pow(1 - p, 4));
  draw();
  if (p < 1) requestAnimationFrame(animar); else finalizar();
}
function finalizar() {
  girando = false;
  $("sortear").disabled = false;
  document.querySelectorAll(".pill").forEach(b => b.disabled = false);
  const d = lista[alvo], mega = d[2].includes("M");
  resultadoSelecionado = d;
  const faixa = $("qsel").value, emoji = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
  $("r1").textContent = `Projeto de hoje: ${d[0]} ! ${emoji}`;
  let msg;
  if (faixa === "") {
    msg = mega ? "Boa sorte nos drops! 💥" : "Boa sorte no catch! ✨";
  } else {
    const [a, b] = faixa.split("-").map(Number);
    const q = a + Math.floor(Math.random() * (b - a + 1));
    msg = mega ? `Meta de Megas mortos: ${q} 💥`
               : `Meta: ${q} Poké Ball${q > 1 ? "s" : ""} 🎯 Boa sorte no catch!`;
  }
  $("r2").textContent = msg;
  salvarResultado();
}

/* ===== PIX ===== */
const tlv = (id, v) => id + String(v.length).padStart(2, "0") + v;
function crc16(s) {
  let c = 0xFFFF;
  for (let i = 0; i < s.length; i++) {
    c ^= s.charCodeAt(i) << 8;
    for (let j = 0; j < 8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF;
  }
  return c.toString(16).toUpperCase().padStart(4, "0");
}
function payloadPix() {
  let p = tlv("00", "01") + tlv("26", tlv("00", "BR.GOV.BCB.PIX") + tlv("01", CHAVE_PIX)) +
          tlv("52", "0000") + tlv("53", "986") + tlv("58", "BR") +
          tlv("59", NOME_PIX) + tlv("60", CIDADE_PIX) + tlv("62", tlv("05", "***")) + "6304";
  return p + crc16(p);
}
let qrFeito = false;
$("btnApoio").onclick = () => {
  $("painel").classList.toggle("open");
  if (!qrFeito && $("painel").classList.contains("open")) {
    qrFeito = true;
    if (window.QRCode) { $("qr").textContent = ""; new QRCode($("qr"), { text: payloadPix(), width: 160, height: 160, correctLevel: QRCode.CorrectLevel.M }); }
    else $("qr").textContent = "QR indisponível";
  }
};
$("kbox").textContent = CHAVE_PIX;
$("copiar").onclick = async () => {
  try { await navigator.clipboard.writeText(CHAVE_PIX); }
  catch (e) { const t = document.createElement("textarea"); t.value = CHAVE_PIX; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
  $("copiar").textContent = "Copiado! ✔";
  setTimeout(() => $("copiar").textContent = "Copiar chave Pix", 2000);
};

/* ===== INÍCIO ===== */
QTDS.forEach(([t, v]) => { const o = document.createElement("option"); o.textContent = t; o.value = v; $("qsel").appendChild(o); });
FILTROS.forEach(([nome, cats], i) => {
  const b = document.createElement("button");
  b.className = "pill" + (i === 0 ? " on" : ""); b.textContent = nome;
  b.onclick = () => {
    if (girando) return;
    document.querySelectorAll(".pill").forEach(x => x.classList.remove("on"));
    b.classList.add("on"); filtroAtual = cats;
    $("r1").textContent = ""; $("r2").textContent = "";
    try { sessionStorage.removeItem(CHAVE_ESTADO_SORTEIO); } catch (e) {}
    aplicarFiltro();
  };
  $("filtros").appendChild(b);
});
$("sortear").onclick = sortear;
D.forEach(d => { new Image().src = BASE + d[1]; });
layout(); aplicarFiltro();
restaurarResultado();
addEventListener("resize", () => {
  if (!girando) {
    const escolhido = resultadoSelecionado;
    layout();

    if (escolhido) {
      const indice = lista.indexOf(escolhido);
      if (indice !== -1) {
        offset = indice * CW + CW / 2 - W / 2;
        draw();
      }
    }
  }
});
</script>
</body>
</html>
